<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    fontFamily: { sans:["Inter","sans-serif"], display:["Space Grotesk","sans-serif"], mono:["JetBrains Mono","monospace"] },
    colors: { base:"#05050a", surface:"#0c0c14", elevated:"#12121c", accent:{DEFAULT:"#00d4ff"}, violet:{DEFAULT:"#7c5cff"}, success:"#00ff9d", danger:"#ff3d71", warning:"#ffb800" }
  }}
}
</script>
<style>
  body { background:#05050a; }
  .mesh { background: radial-gradient(at 20% 20%, rgba(124,92,255,0.12) 0px, transparent 50%), radial-gradient(at 80% 30%, rgba(0,212,255,0.12) 0px, transparent 50%), radial-gradient(at 40% 80%, rgba(0,255,157,0.06) 0px, transparent 50%); }
  .glass { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border:1px solid rgba(255,255,255,0.08); transition:all .4s cubic-bezier(.4,0,.2,1); }
  .glass:hover { background:rgba(255,255,255,0.05); border-color:rgba(0,212,255,0.3); box-shadow:0 20px 60px rgba(0,212,255,0.1); }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:#05050a; } ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#7c5cff,#00d4ff); border-radius:3px; }
  ::selection { background:rgba(0,212,255,0.3); color:#fff; }
  input,select,textarea { background:#12121c; border:1px solid rgba(255,255,255,0.08); color:#fff; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:#00d4ff; box-shadow:0 0 0 3px rgba(0,212,255,0.15); }
  input::placeholder { color:rgba(255,255,255,0.3); }
</style>
</head>
<title>Glosario — CryptoEduar</title>
</head>
<body class="bg-base text-white font-sans antialiased overflow-x-hidden">
<nav class="fixed top-0 inset-x-0 z-50 border-b border-white/[0.06] bg-base/70 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet to-accent flex items-center justify-center font-display font-bold text-sm shadow-[0_0_20px_rgba(124,92,255,0.5)]">CE</div>
      <span class="font-display font-semibold tracking-tight">CryptoEduar</span>
    </a>
    <div class="hidden md:flex items-center gap-8 text-sm text-white/60">
      <a href="index.html" class="hover:text-white transition">Inicio</a>
      <a href="cursos.html" class="hover:text-white transition">Cursos</a>
      <a href="dashboard.html" class="hover:text-white transition">Dashboard</a>
      <a href="herramientas.html" class="hover:text-white transition">Herramientas</a>
      <a href="videos.html" class="hover:text-white transition">Videos</a>
    </div>
    <a href="index.html" class="text-sm font-medium px-4 py-2 rounded-lg bg-white text-black hover:bg-accent transition">Inicio</a>
  </div>
</nav>

<section class="relative pt-32 pb-12 overflow-hidden">
  <div class="absolute inset-0 mesh"></div>
  <div class="relative max-w-7xl mx-auto px-6">
    <div class="text-xs font-mono text-accent mb-4 tracking-wider">// GLOSARIO</div>
    <h1 class="font-display text-5xl md:text-7xl font-bold tracking-tight mb-6">Diccionario cripto</h1>
    <p class="text-lg text-white/60 max-w-2xl mb-8">Términos de ciberseguridad y blockchain explicados de forma clara.</p>
    <div class="max-w-xl">
      <input id="search" placeholder="Buscar término..." class="w-full px-5 py-4 rounded-xl text-base bg-white/[0.03] border border-white/10">
    </div>
  </div>
</section>

<section class="relative pb-32">
  <div class="max-w-5xl mx-auto px-6">
    <div id="glosario-container" class="space-y-12"></div>
  </div>
</section>

<footer class="border-t border-white/[0.06] py-12 mt-24">
  <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-white/40">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-md bg-gradient-to-br from-violet to-accent"></div>
      <span>CryptoEduar © 2026</span>
    </div>
    <div>Contenido educativo · No somos asesores financieros</div>
  </div>
</footer>
<script>
const GLOSARIO = ;
function render(filter=""){
  const cont = document.getElementById("glosario-container");
  const f = filter.toLowerCase();
  let html = "";
  Object.keys(GLOSARIO).sort().forEach(letra=>{
    const items = Object.entries(GLOSARIO[letra]).filter(([k,v])=> !f || k.toLowerCase().includes(f) || v.toLowerCase().includes(f));
    if(!items.length) return;
    html += `<div>
      <div class="flex items-center gap-4 mb-6">
        <div class="font-display text-4xl font-bold text-accent">${letra}</div>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        ${items.map(([k,v])=>`<div class="glass rounded-xl p-5">
          <div class="font-display font-semibold text-white mb-2">${k}</div>
          <div class="text-sm text-white/60 leading-relaxed">${v}</div>
        </div>`).join("")}
      </div>
    </div>`;
  });
  cont.innerHTML = html || '<div class="text-center text-white/40 py-20">Sin resultados para "'+filter+'"</div>';
}
document.getElementById("search").addEventListener("input", e=> render(e.target.value));
render();
</script>
</body></html>
